# Curated weight corrections applied on top of scraped data by `cli normalize`
# (idempotent; re-applied after every firstclass rebuild). Use when a source value
# is demonstrably wrong and a better-homologated figure exists. Matching: make +
# model (canonical names) + case-insensitive substring of the trim. Weights are the
# Hungarian "saját tömeg" convention (EU unladen mass, no driver).
overrides:
  - make: XPeng
    model: "P7+"
    trim_contains: standard
    weight_kg: 1999
    reason: >
      Pinned to the OFFICIAL Hungarian importer price list (P7+ árlista, Tömeg
      table): saját tömeg 1999 kg for Standard range (with tow bar: 2024 kg;
      Long range 2100, Performance 2200 — matching our other rows). A 2026-08
      "correction" to 2075 kg based on NL RDW massa_ledig was wrong for the
      Hungarian saját tömeg convention; this entry prevents that regression.
    source_url: https://cmsimages.carusseldwt.com/cms/downloads/PROD/HU/Xpeng/XP_0000/95d55044-93ff-46e2-b695-3b83f12da439/P7+%20árlista.pdf
